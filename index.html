<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root{
    --bg:#12161B; --surface:#1A2029; --surface2:#212A36; --border:#2B3440;
    --text:#E7EBEF; --muted:#8592A3; --accent:#F0C419; --danger:#C8102E; --ok:#3FA88C; --info:#3B5FC0;
    --crest-red:#C8102E; --crest-blue:#0B1F6E;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:520px; margin:0 auto; padding:16px 16px 90px;}
  .topbar{height:4px; background:linear-gradient(90deg, var(--crest-red) 0%, var(--crest-red) 33%, var(--accent) 33%, var(--accent) 66%, var(--crest-blue) 66%, var(--crest-blue) 100%);}
  .header{display:flex; align-items:center; gap:10px; padding:14px 0 14px; border-bottom:1px solid var(--border); margin-bottom:16px;}
  .crest{width:42px; height:auto; flex-shrink:0;}
  .title{font-family:'Oswald',sans-serif; font-size:19px; letter-spacing:0.5px; line-height:1.1;}
  .sub{color:var(--muted); font-size:12px; margin-top:2px;}
  .gear{margin-left:auto; background:none; border:none; color:var(--muted); cursor:pointer; font-size:18px;}
  label{display:block; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;}
  input, select, textarea{
    width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; color:var(--text); font-family:'Inter',sans-serif; font-size:14px; outline:none; margin-bottom:12px;
  }
  input[list]{background:var(--surface2);}
  .row{display:flex; gap:10px;}
  .row > div{flex:1;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:12px;}
  .btn{
    font-family:'Oswald',sans-serif; letter-spacing:0.5px; border:none; border-radius:8px; padding:11px 14px;
    cursor:pointer; font-size:14px;
  }
  .btn-accent{background:var(--accent); color:#181205;}
  .btn-ghost{background:var(--surface2); color:var(--text); border:1px solid var(--border);}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid var(--danger);}
  .btn-block{width:100%;}
  .efetivo-row{background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:8px; position:relative;}
  .rm{position:absolute; top:8px; right:8px; background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px;}
  .tabs{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px;}
  .tab{text-align:center; padding:9px 4px; border-radius:8px; background:var(--surface2); color:var(--muted); font-family:'Oswald',sans-serif; font-size:11.5px; line-height:1.2; cursor:pointer; border:1px solid var(--border);}
  .tab.active{background:var(--accent); color:#181205; border-color:var(--accent);}
  .section-title{font-family:'Oswald',sans-serif; font-size:16px; margin-bottom:10px;}
  .muted{color:var(--muted); font-size:12.5px;}
  .empty{border:1px dashed var(--border); color:var(--muted); border-radius:10px; padding:20px; text-align:center; font-size:13px;}
  .launch-preview{font-family:'JetBrains Mono', monospace; font-size:12px; white-space:pre-wrap; color:var(--text); background:var(--surface2); border-radius:8px; padding:10px; margin-top:8px; line-height:1.5;}
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:16px 16px 0 0; width:100%; max-width:520px; padding:18px; max-height:85vh; overflow-y:auto;}
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .close{background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer;}
  .hidden{display:none;}
  .flex-between{display:flex; justify-content:space-between; align-items:center;}
  .badge{font-size:10.5px; padding:2px 8px; border-radius:10px; font-family:'Inter',sans-serif;}
</style>
</head>

function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDatePT(iso){ const [y,m,d]=iso.split("-"); return `${d}${MESES[parseInt(m,10)-1]}${y}`; }
function fmtDateBR(iso){ const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; }
function fmtWhen(ts){
  if(!ts) return '-';
  const d = new Date(ts);
  return `${fmtDateBR(d.toISOString().slice(0,10))} às ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

async function storageGet(key){
  let serverResponded = false;
  try{
    const snap = await db.collection(KV_COLLECTION).doc(key).get();
    serverResponded = true;
    if(snap.exists){
      const value = snap.data().value;
      try{ localStorage.setItem('efetivo_cache_' + key, value); }catch(e){}
      return { key, value };
    }
    // o servidor respondeu e confirmou que não há dado para essa chave:
    // essa é a resposta correta e definitiva — descarta qualquer cache antigo local
    try{ localStorage.removeItem('efetivo_cache_' + key); }catch(e){}
    throw new Error('not found');
  }catch(e){
    if(serverResponded) throw e; // servidor respondeu de verdade: não usar cache velho
    // sem internet ou Firestore indisponível (falha de rede real): usa a última cópia salva neste aparelho
    const cached = localStorage.getItem('efetivo_cache_' + key);
    if(cached !== null) return { key, value: cached };
    throw new Error('not found');
  }
}

async function storageSet(key, value){
  await db.collection(KV_COLLECTION).doc(key).set({
    value: value,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  try{ localStorage.setItem('efetivo_cache_' + key, value); }catch(e){}
  return { key, value };
}

function isLaunchEditable(launch){
  if(isAdmin()) return true; // admin não tem trava de horário
  // o lançamento pode ser editado/removido até editLockHour:00 do dia seguinte à data do serviço
  const limite = new Date(launch.date + 'T00:00:00');
  limite.setDate(limite.getDate() + 1);
  limite.setHours(editLockHour, 0, 0, 0);
  return new Date() <= limite;
}

function computeServiceWindow(launch){
  const [ih, im] = (launch.inicio || '00:00').split(':').map(Number);
  const [fh, fm] = (launch.fim || '00:00').split(':').map(Number);
  const start = new Date(launch.date + 'T00:00:00');
  start.setHours(ih || 0, im || 0, 0, 0);
  let end = new Date(launch.date + 'T00:00:00');
  end.setHours(fh || 0, fm || 0, 0, 0);
  if(end <= start) end.setDate(end.getDate() + 1); // atravessa a meia-noite
  const activeUntil = new Date(end.getTime() + activeWindowHours * 60 * 60 * 1000);
  return { start, end, activeUntil };
}

function isWithinActiveWindow(launch){
  const w = computeServiceWindow(launch);
  const now = new Date();
  return now >= w.start && now <= w.activeUntil;
}

function windowsOverlap(a, b){
  const wa = computeServiceWindow(a);
  const wb = computeServiceWindow(b);
  return wa.start < wb.end && wb.start < wa.end;
}

function detectScheduleConflicts(list){
  // list: lançamentos não removidos e não desativados manualmente
  const ativos = list.filter(l => l.ativo !== false);
  const byOfficer = {};
  ativos.forEach(l => {
    (l.efetivo || []).forEach(p => {
      const key = ((p.re || '').trim() || (p.nome || '').trim().toLowerCase());
      if(!key) return;
      if(!byOfficer[key]) byOfficer[key] = [];
      byOfficer[key].push({ l, p });
    });
  });
  const conflicts = {}; // key -> nome do policial em conflito
  Object.entries(byOfficer).forEach(([key, entries]) => {
    if(entries.length < 2) return;
    for(let i = 0; i < entries.length; i++){
      for(let j = i + 1; j < entries.length; j++){
        if(windowsOverlap(entries[i].l, entries[j].l)){
          conflicts[key] = entries[i].p.nome;
        }
      }
    }
  });
  return conflicts;
}

function renderEquipesAtivasBody(){

  const html = itens.length === 0
    ? `<div class="empty">Nenhuma equipe/posto ativo no momento.</div>`
    : itens.map(({ date, launch: l }) => {
        const w = computeServiceWindow(l);
        const atrasada = new Date() > w.activeUntil;
        const headerLine = [l.evento, l.gt, l.cidade, l.codigo].filter(Boolean).join(' - ');

          <div class="card">

      }).join('');

  document.getElementById('viewAtivas').innerHTML = `

}

async function runAuditoria(){
  const filtroUsuario = document.getElementById('auditUsuario').value.trim().toLowerCase();
  const de = document.getElementById('auditDe').value;
  const ate = document.getElementById('auditAte').value;
  const resEl = document.getElementById('auditResultado');
  if(!de || !ate || de > ate){
    resEl.innerHTML = `<div class="empty">Verifique as datas — "De" precisa ser antes ou igual a "Até".</div>`;
    return;
  }

  const dateList = [];
  let cursor = new Date(de + 'T00:00:00');
  const fim = new Date(ate + 'T00:00:00');
  while(cursor <= fim && dateList.length < 400){
    dateList.push(cursor.toISOString().slice(0, 10));
    cursor.setDate(cursor.getDate() + 1);
  }

  resEl.innerHTML = `<div class="empty">Gerando auditoria entre ${fmtDateBR(de)} e ${fmtDateBR(ate)}...</div>`;

  const jobs = [];
  dateList.forEach(d => {
    jobs.push(storageGet(launchesKey(d)).then(r => ({ tipo: 'daily', arr: JSON.parse(r.value) })).catch(() => null));
    jobs.push(storageGet(eventLaunchesKey(d)).then(r => ({ tipo: 'evento', arr: JSON.parse(r.value) })).catch(() => null));
  });
  const results = await Promise.all(jobs);

  const registros = [];
  results.forEach(item => {
    if(!item) return;
    item.arr.forEach(l => {
      const headerLine = [l.evento, l.gt, l.cidade, l.codigo].filter(Boolean).join(' - ') || '(sem cabeçalho)';
      const base = { data: l.date, tipoLancamento: item.tipo === 'evento' ? 'Evento/ Operação' : 'Serviço diário', headerLine };
      if(l.criadoPor){
        registros.push({ ...base, acao: 'Cadastro', usuario: l.criadoPor, quando: l.createdAt, detalhe: '' });
      }
      if(l.edited && l.editadoPor){
        registros.push({ ...base, acao: 'Edição', usuario: l.editadoPor, quando: l.editedAt, detalhe: '' });
      }
      if(l.removed && l.removidoPor){
        registros.push({ ...base, acao: 'Remoção', usuario: l.removidoPor, quando: l.removedAt, detalhe: l.removedReason || '' });
      }
      if(l.ativoAlteradoPor && l.ativoAlteradoEm){
        registros.push({ ...base, acao: l.ativo === false ? 'Encerrou equipe/posto' : 'Reabriu equipe/posto', usuario: l.ativoAlteradoPor, quando: l.ativoAlteradoEm, detalhe: '' });
      }
    });
  });

  const filtrados = filtroUsuario
    ? registros.filter(r => (r.usuario || '').toLowerCase().includes(filtroUsuario))
    : registros;

  filtrados.sort((a, b) => b.quando - a.quando);
  auditoriaCache = filtrados;

  if(filtrados.length === 0){
    resEl.innerHTML = `<div class="empty">Nenhuma ação encontrada nesse período/filtro.</div>`;
    return;
  }

  resEl.innerHTML = `
    <div class="card">
      <button class="btn btn-accent btn-block" onclick="generateAuditoriaPDF()">📄 Gerar PDF da auditoria</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="generateAuditoriaXLSX()">📊 Exportar planilha (Excel)</button>
    </div>
    <div class="section-title">${filtrados.length} ação(ões) encontrada(s)</div>
    ${filtrados.map(r => `
      <div class="card">
        <div class="flex-between">
          <span style="color:var(--accent); font-family:'Oswald',sans-serif; font-size:13.5px;">${r.acao}</span>
          <span class="muted" style="font-family:'JetBrains Mono', monospace; font-size:11px;">${fmtWhen(r.quando)}</span>
        </div>
        <div style="color:var(--text); font-family:'Inter',sans-serif; font-size:13.5px; margin-top:4px;">${r.usuario}</div>
        <div class="muted" style="margin-top:4px;">${fmtDateBR(r.data)} · ${r.tipoLancamento} · ${r.headerLine}</div>
        ${r.detalhe ? `<div class="muted" style="margin-top:4px;">Motivo: ${r.detalhe}</div>` : ''}
      </div>
    `).join('')}
  `;
}

function generateAuditoriaXLSX(){
  if(auditoriaCache.length === 0) return;
  const rows = auditoriaCache.map(r => ({
    'Ação': r.acao,
    'Usuário': r.usuario,
    'Quando': fmtWhen(r.quando),
    'Data do serviço': fmtDateBR(r.data),
    'Tipo': r.tipoLancamento,
    'Serviço': r.headerLine,
    'Detalhe/ Motivo': r.detalhe
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Auditoria');
  XLSX.writeFile(wb, `auditoria_${todayISO()}.xlsx`);
}

function generateAuditoriaPDF(){
  if(auditoriaCache.length === 0) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const marginL = 48, marginR = 48;
  const contentW = pageW - marginL - marginR;
  let y = 56;

  function checkPage(need){
    if(y + need > 780){ doc.addPage(); y = 56; }
  }
  function line(text, opts = {}){
    const size = opts.size || 10.5;
    const bold = opts.bold || false;
    const gap = opts.gap !== undefined ? opts.gap : size + 6;
    doc.setFont('helvetica', bold ? 'bold' : 'normal');
    doc.setFontSize(size);
    const wrapped = doc.splitTextToSize(text, contentW);
    checkPage(wrapped.length * gap + 4);
    doc.text(wrapped, marginL, y);
    y += wrapped.length * gap;
  }

  doc.setFillColor(11, 31, 110);
  doc.rect(0, 0, pageW, 60, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.text('RELATÓRIO DE AUDITORIA', marginL, 32);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.text('9ª Companhia Independente de Polícia Militar', marginL, 48);
  doc.setTextColor(0, 0, 0);
  y = 88;

  auditoriaCache.forEach(r => {
    checkPage(70);
    line(`${r.acao} — ${r.usuario}`, {bold:true, size:11.5, gap:15});
    line(`Quando: ${fmtWhen(r.quando)}`, {size:9.5, gap:12});
    line(`Serviço: ${r.headerLine} (${r.tipoLancamento}, data ${fmtDateBR(r.data)})`, {size:9.5, gap:12});
    if(r.detalhe){
      line(`Motivo: ${r.detalhe}`, {size:9.5, gap:12});
    }
    y += 6;
    doc.setDrawColor(230); doc.line(marginL, y, pageW - marginR, y);
    y += 14;
  });

  doc.save(`auditoria_${todayISO()}.pdf`);
}

function findVehicleByPlaca(placa){
  const alvo = (placa || '').trim().toUpperCase();
  if(!alvo) return null;
  return vehicleIndex.find(v => v.placa.trim().toUpperCase() === alvo) || null;
}

async function updateVehicleIndex(...viaturas){
  let changed = false;
  viaturas.forEach(v => {
    if(!v) return;
    const placa = (v.placa || '').trim().toUpperCase();
    if(!placa) return;
    const modelo = (v.modelo || '').trim();
    const pat = (v.pat || '').trim();
    let existing = vehicleIndex.find(x => x.placa.trim().toUpperCase() === placa);
    if(!existing){
      vehicleIndex.push({ placa, modelo, pat });
      changed = true;
    } else {
      if(modelo && existing.modelo !== modelo){ existing.modelo = modelo; changed = true; }
      if(pat && existing.pat !== pat){ existing.pat = pat; changed = true; }
    }
  });
  if(changed){ await saveKey('vehicle-index', vehicleIndex); }
}

function onPlacaChangeGeral(placaId, modeloId, patId){
  const placa = document.getElementById(placaId).value;
  const match = findVehicleByPlaca(placa);
  if(match){
    const modeloEl = document.getElementById(modeloId);
    const patEl = document.getElementById(patId);
    if(modeloEl && !modeloEl.value) modeloEl.value = match.modelo || '';
    if(patEl && !patEl.value) patEl.value = match.pat || '';
  }
}

  const ctx = map[updateFnName];
  if(!ctx) return;
  ctx.setPlaca(id, 'placa', placaValue);
  const row = ctx.rows().find(r => r.id === id);
  if(row && row.viatura){
    const match = findVehicleByPlaca(placaValue);
    if(match){
      if(!row.viatura.modelo) row.viatura.modelo = match.modelo || '';
      if(!row.viatura.pat) row.viatura.pat = match.pat || '';
    }
  }
  ctx.render();
}

function findOfficerByName(nome){
  const alvo = (nome || '').trim().toLowerCase();
  if(!alvo) return null;
  return officerIndex.find(o => o.nome.trim().toLowerCase() === alvo) || null;
}

async function updateOfficerIndex(efetivoList){
  let changed = false;
  (efetivoList || []).forEach(p => {
    if(!p.nome || !p.nome.trim()) return;
    const re = (p.re || '').trim();
    const nome = p.nome.trim();
    const patente = (p.patente || '').trim();
    const tel = (p.tel || '').trim();
    let existing = re ? officerIndex.find(o => (o.re || '').trim() === re) : null;
    if(!existing) existing = officerIndex.find(o => o.nome.trim().toLowerCase() === nome.toLowerCase());
    if(!existing){
      officerIndex.push({ nome, re, patente, tel });
      changed = true;
    } else {
      if(patente && existing.patente !== patente){ existing.patente = patente; changed = true; }
      if(re && existing.re !== re){ existing.re = re; changed = true; }
      if(tel && existing.tel !== tel){ existing.tel = tel; changed = true; }
      if(existing.nome !== nome){ existing.nome = nome; changed = true; }
    }
  });
  if(changed){ await saveKey('officer-index', officerIndex); }
}

async function addEventToIndex(name){
  if(!name) return;
  if(!eventIndex.includes(name)){
    eventIndex.push(name);
    await saveKey('event-index', eventIndex);
  }
}

async function persistLaunches(){
  await saveKey(activeBucketKey(), launches);
}
async function persistDailyCommand(){
  await saveKey('command-static', dailyCommandCurrent);
}

async function saveKey(key, value, attempt = 1){
  try{
    const result = await storageSet(key, JSON.stringify(value));
    if(!result){
      throw new Error('Gravação retornou vazio');
    }
    if(saveErrorMsg){ saveErrorMsg = ''; renderSaveBanner(); }
    return true;
  }catch(e){
    if(attempt < 3){
      await new Promise(r => setTimeout(r, 400));
      return saveKey(key, value, attempt + 1);
    }
    saveErrorMsg = 'Não foi possível salvar as últimas alterações neste dispositivo. Verifique sua conexão e evite fechar a página até confirmar que salvou.';
    renderSaveBanner();
    return false;
  }
}

function renderSaveBanner(){
  const el = document.getElementById('saveBanner');
  if(!el) return;
  el.innerHTML = saveErrorMsg
    ? `<div style="background:#3A2418; border:1px solid var(--danger); color:#F2B8A9; font-size:12px; border-radius:8px; padding:10px 12px; margin-bottom:14px;">⚠️ ${saveErrorMsg}</div>`
    : '';
}

async function saveLaunch(){
  const gt = document.getElementById('fGt').value.trim();
  const cidade = document.getElementById('fCidade').value.trim();
  const codigo = document.getElementById('fCodigo').value.trim();
  const data = document.getElementById('fData').value || todayISO();
  const inicio = document.getElementById('fInicio').value;
  const fim = document.getElementById('fFim').value;
  const viatura = {
    modelo: document.getElementById('vModelo').value.trim(),
    km: document.getElementById('vKm').value.trim(),
    pat: document.getElementById('vPat').value.trim(),
    placa: document.getElementById('vPlaca').value.trim(),
    armadoCartao: (document.querySelector('input[name="vArmado"]:checked') || {}).value || ''
  };
  const efetivo = efetivoRows.filter(r => r.nome.trim() !== "");

  if(efetivo.length === 0){
    alert("Adicione ao menos um policial no efetivo antes de salvar.");
    return;
  }

  const launch = {
    id: uid(),
    date: data,
    inicio, fim,
    gt, cidade, codigo,
    efetivo, viatura,
    gcoi: false, gcoiAt: null,
    ativo: true,
    criadoPor: currentUserEmail,
    createdAt: Date.now()
  };

  setBtnSaving('btnSaveLaunch', true);
  if(data !== selectedDate || activeBucketType !== 'daily'){
    await loadDateData(data);
  }
  launches.push(launch);
  selectedDate = data;
  await persistLaunches();
  await updateOfficerIndex(launch.efetivo);
  await updateVehicleIndex(launch.viatura, ...launch.efetivo.map(p => p.viatura));
  lastHeader = { gt, cidade, codigo };
  resetNewForm();
  switchTab('day');
}

// ---------- QUANTITATIVO DE LANÇAMENTOS ----------
function computeQuantitativo(list){
  const counts = {};
  const countsAtivos = {};
  list.forEach(l => {
    const ativo = l.ativo !== false;
    (l.efetivo || []).forEach(p => {
      const pat = (p.patente || '').trim() || '(não informado)';
      counts[pat] = (counts[pat] || 0) + 1;
      if(ativo) countsAtivos[pat] = (countsAtivos[pat] || 0) + 1;
    });
  });
  const entries = Object.entries(counts).sort((a, b) => a[0].localeCompare(b[0])).map(([pat, n]) => [pat, n, countsAtivos[pat] || 0]);
  let oficiais = 0, pracas = 0, outros = 0, oficiaisAtivos = 0, pracasAtivos = 0, outrosAtivos = 0;
  entries.forEach(([pat, n, nAtivo]) => {
    if(OFICIAIS_PATENTES.includes(pat)){ oficiais += n; oficiaisAtivos += nAtivo; }
    else if(PRACAS_PATENTES.includes(pat)){ pracas += n; pracasAtivos += nAtivo; }
    else { outros += n; outrosAtivos += nAtivo; }
  });
  return {
    entries, oficiais, pracas, outros, total: oficiais + pracas,
    oficiaisAtivos, pracasAtivos, outrosAtivos, totalAtivos: oficiaisAtivos + pracasAtivos
  };
}

function computeVeiculos(list){
  const carrosPlacas = new Set();
  const carrosPlacasAtivas = new Set();
  const motosPlacas = new Set();
  const motosPlacasAtivas = new Set();
  let carrosSemPlaca = 0, carrosSemPlacaAtivos = 0;
  let motosSemPlaca = 0, motosSemPlacaAtivos = 0;
  list.forEach(l => {
    const ativo = l.ativo !== false;
    const gv = l.viatura || {};
    const temDadoGeral = gv.modelo || gv.km || gv.pat || gv.placa;
    if(temDadoGeral){
      const placa = (gv.placa || '').trim().toUpperCase();
      if(placa){ carrosPlacas.add(placa); if(ativo) carrosPlacasAtivas.add(placa); }
      else { carrosSemPlaca++; if(ativo) carrosSemPlacaAtivos++; }
    }
    (l.efetivo || []).forEach(p => {
      if(p.viatura){
        const placa = (p.viatura.placa || '').trim().toUpperCase();
        if(placa){ motosPlacas.add(placa); if(ativo) motosPlacasAtivas.add(placa); }
        else { motosSemPlaca++; if(ativo) motosSemPlacaAtivos++; }
      }
    });
  });
  const carros = carrosPlacas.size + carrosSemPlaca;
  const carrosAtivos = carrosPlacasAtivas.size + carrosSemPlacaAtivos;
  const motos = motosPlacas.size + motosSemPlaca;
  const motosAtivos = motosPlacasAtivas.size + motosSemPlacaAtivos;
  return { carros, motos, total: carros + motos, carrosAtivos, motosAtivos, totalAtivos: carrosAtivos + motosAtivos };
}

function computeEquipesPostos(list){
  let equipes = 0, postos = 0, equipesAtivas = 0, postosAtivos = 0;
  list.forEach(l => {
    const gv = l.viatura || {};
    const temViaturaGeral = !!(gv.modelo || gv.km || gv.pat || gv.placa);
    const temMoto = (l.efetivo || []).some(p => !!p.viatura);
    const isEquipe = temViaturaGeral || temMoto;
    const ativo = l.ativo !== false;
    if(isEquipe){ equipes++; if(ativo) equipesAtivas++; }
    else { postos++; if(ativo) postosAtivos++; }
  });
  return { equipes, postos, total: equipes + postos, equipesAtivas, postosAtivos, totalAtivos: equipesAtivas + postosAtivos };
}

    </div>
    <div class="section-title">Usuários cadastrados (${lista.length}${filtro ? ` de ${usuariosListaCache.length}` : ''})</div>
    ${lista.length === 0 ? `<div class="empty">${usuariosListaCache.length === 0 ? 'Nenhum usuário cadastrado ainda.' : 'Nenhum usuário encontrado para essa busca.'}</div>` :
      lista.map(u => `
        <div class="card">
          <div class="flex-between">
            <div>
              <div style="color:var(--text); font-family:'Inter',sans-serif; font-size:14px; font-weight:500;">${u.nome || '(sem nome)'}</div>

            </div>
            ${isAdmin() && u.email !== currentUserEmail ? `<button class="btn btn-danger" onclick="removeUsuario('${u.email}')">Remover</button>` : ''}
          </div>
        </div>
      `).join('')}
  `;
  // preserva o foco no campo de busca após re-renderizar
  const filtroInput = document.getElementById('filtroUsuarios');
  if(filtroInput && filtro){
    filtroInput.focus();
    filtroInput.setSelectionRange(filtro.length, filtro.length);
  }

async function addUsuario(){
  const nome = document.getElementById('novoUserNome').value.trim();
  const email = document.getElementById('novoUserEmail').value.trim().toLowerCase();
  const senha = document.getElementById('novoUserSenha').value;
  const nivel = document.getElementById('novoUserNivel').value;
  if(!nome){
    alert('Informe o nome do usuário.');
    return;
  }
  if(!email || !email.includes('@')){
    alert('Informe um e-mail válido.');
    return;
  }
  if(!senha || senha.length < 6){
    alert('A senha precisa ter pelo menos 6 caracteres.');
    return;
  }
  if(!creatableLevels().includes(nivel)){
    alert('Você não tem permissão para cadastrar esse nível.');
    return;
  }

  const btn = document.getElementById('btnAddUsuario');
  if(btn){ btn.disabled = true; btn.textContent = 'Adicionando...'; }

  try{
    const secAuth = getSecondaryAuth();
    try{
      await secAuth.createUserWithEmailAndPassword(email, senha);
    }catch(e){
      if(e.code !== 'auth/email-already-in-use') throw e;
      // já existe conta de login pra esse e-mail: só ajustamos a permissão abaixo
    }
    await secAuth.signOut();

    await db.collection(PERMISSIONS_COLLECTION).doc(email).set({
      nome,
      nivel,
      criadoPor: currentUserEmail,
      criadoEm: firebase.firestore.FieldValue.serverTimestamp()
    });
    renderUsuariosView();
  }catch(e){
    alert('Erro ao adicionar usuário: ' + e.message);
    if(btn){ btn.disabled = false; btn.textContent = 'Adicionar'; }
  }
}

async function removeUsuario(email){
  if(!isAdmin()) return;
  if(!confirm(`Remover o acesso de ${email}?`)) return;
  try{
    await db.collection(PERMISSIONS_COLLECTION).doc(email).delete();
    renderUsuariosView();
  }catch(e){
    alert('Erro ao remover usuário: ' + e.message);
  }
}


async function runBusca(){
  const termo = document.getElementById('buscaInput').value.trim().toLowerCase();
  const de = document.getElementById('buscaDe').value;
  const ate = document.getElementById('buscaAte').value;
  const resEl = document.getElementById('buscaResultado');
  if(!termo){
    resEl.innerHTML = `<div class="empty">Digite um nome ou matrícula para buscar.</div>`;
    return;
  }
  if(!de || !ate || de > ate){
    resEl.innerHTML = `<div class="empty">Verifique as datas — "De" precisa ser antes ou igual a "Até".</div>`;
    return;
  }

  const dateList = [];
  let cursor = new Date(de + 'T00:00:00');
  const fim = new Date(ate + 'T00:00:00');
  while(cursor <= fim && dateList.length < 400){
    dateList.push(cursor.toISOString().slice(0, 10));
    cursor.setDate(cursor.getDate() + 1);
  }
  if((fim - new Date(de + 'T00:00:00')) / 86400000 + 1 > 400){
    resEl.innerHTML = `<div class="empty">Período muito longo (máx. 400 dias). Ajuste as datas.</div>`;
    return;
  }

  resEl.innerHTML = `<div class="empty">Buscando entre ${fmtDateBR(de)} e ${fmtDateBR(ate)}...</div>`;

  const jobs = [];
  dateList.forEach(d => {
    jobs.push(storageGet(launchesKey(d)).then(r => ({ date: d, tipo: 'daily', arr: JSON.parse(r.value) })).catch(() => null));
    jobs.push(storageGet(eventLaunchesKey(d)).then(r => ({ date: d, tipo: 'evento', arr: JSON.parse(r.value) })).catch(() => null));
  });

  const results = await Promise.all(jobs);
  const found = [];

  results.forEach(item => {
    if(!item) return;
    item.arr.forEach(l => {
      if(l.removed) return;
      (l.efetivo || []).forEach(p => {
        const nomeMatch = (p.nome || '').toLowerCase().includes(termo);
        const reMatch = (p.re || '').toLowerCase().includes(termo);
        if(nomeMatch || reMatch){
          found.push({ launch: l, tipo: item.tipo, date: item.date, oficial: p });
        }
      });
    });
  });

  if(found.length === 0){
    resEl.innerHTML = `<div class="empty">Nenhum lançamento encontrado para "${termo}" nesse período.</div>`;
    return;
  }

  currentConflictKeys = {};
  found.sort((a, b) => b.launch.createdAt - a.launch.createdAt);

  resEl.innerHTML = `
    <div class="section-title">${found.length} resultado(s) encontrado(s)</div>
    ${found.map(f => {
      const headerLine = [f.launch.evento, f.launch.gt, f.launch.cidade, f.launch.codigo].filter(Boolean).join(' - ');
      return `
        <div class="card" style="cursor:pointer;" onclick="goToLaunchFromBusca('${f.date}','${f.tipo}','${f.launch.id}')">
          <div class="flex-between">
            <div class="muted">${fmtDateBR(f.date)} · ${f.tipo === 'evento' ? 'Evento/ Operação' : 'Serviço diário'}</div>
            <span style="color:var(--accent);">Abrir cadastro ›</span>
          </div>
          <div style="color:var(--text); font-family:'Inter',sans-serif; font-size:14px; font-weight:500; margin-top:4px;">${headerLine || '(sem cabeçalho)'}</div>
          <div class="muted" style="margin-top:4px;">${f.launch.inicio}–${f.launch.fim}</div>
          <div class="launch-preview" style="margin-top:8px;">${f.oficial.patente} ${f.oficial.re} ${f.oficial.nome}${f.oficial.motorista ? ' (motorista)' : ''}${f.oficial.tel ? '\nTel. ' + f.oficial.tel : ''}</div>
        </div>
      `;
    }).join('')}
  `;
}

async function goToLaunchFromBusca(date, tipo, launchId){
  document.getElementById('tabNew').classList.remove('active');
  document.getElementById('tabNewEvento').classList.remove('active');
  document.getElementById('tabQuant').classList.remove('active');
  document.getElementById('tabBusca').classList.remove('active');
  document.getElementById('tabDay').classList.toggle('active', tipo !== 'evento');
  document.getElementById('tabDayEvento').classList.toggle('active', tipo === 'evento');
  document.getElementById('viewNew').classList.add('hidden');
  document.getElementById('viewNewEvento').classList.add('hidden');
  document.getElementById('viewQuant').classList.add('hidden');
  document.getElementById('viewBusca').classList.add('hidden');
  document.getElementById('viewDay').classList.toggle('hidden', tipo === 'evento');
  document.getElementById('viewDayEvento').classList.toggle('hidden', tipo !== 'evento');
  currentTab = tipo === 'evento' ? 'dayEvento' : 'day';

  if(tipo === 'evento'){
    await loadEventoData(date);
    renderEventoListBody();
  } else {
    await loadDateData(date);
    renderDayView();
  }
  openEditLaunch(launchId);
}

function shareWhatsApp(id){

  const headerLine = [l.evento, l.gt, l.cidade, l.codigo].filter(Boolean).join(' - ');

  const efetivoTxt = l.efetivo.map(p => {
    const icone = p.sexo === 'F' ? '👮🏻‍♀️' : '👮🏻‍♂️';
    let bloco = `${icone} ${p.patente} ${p.re} ${p.nome}`;

    return bloco;
  }).join('\n\n');

  const gv = l.viatura || {};

  const viaturaTxt = temViaturaGeral

    : '';

  const texto = `🚨 CADASTRO DE EFETIVO 🚨\n\n${headerLine}\n\n📆 Data: ${fmtDatePT(l.date)}\n⏰ horário: ${l.inicio} às ${l.fim}\n\nEFETIVO:\n\n${efetivoTxt}${viaturaTxt}\n\nGCOI: ${l.gcoi ? '✅' : '❌'}\n\nCMD: ${dc.comando || '-'}\nSUBCMD: ${dc.subcomando || '-'}\n\n🌵 ${MOTTO}\n☀️`;

async function deleteLaunch(id){
  const l = launches.find(x => x.id === id);
  if(!l) return;
  if(!canRemoveLaunch()){
    alert('Seu nível de acesso não permite remover cadastros.');
    return;
  }
  if(!isLaunchEditable(l)){
    alert('O prazo para remover este lançamento já encerrou.');
    return;
  }
  const reason = prompt('Informe o motivo da remoção deste lançamento (obrigatório). Ele continuará no relatório PDF, com essa justificativa.');
  if(reason === null) return; // cancelado
  if(!reason.trim()){
    alert('É necessário informar um motivo para remover o lançamento.');
    return;
  }
  l.removed = true;
  l.removedAt = Date.now();
  l.removedReason = reason.trim();
  l.removidoPor = currentUserEmail;
  await persistLaunches();
  renderActiveListView();
}

function generatePDF(){
  const dayLaunches = activeBucketType === 'evento' ? sortGroupedByEvento(launches) : [...launches].sort((a,b) => a.createdAt - b.createdAt);
  if(dayLaunches.length === 0) return;

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const marginL = 48;
  const marginR = 48;
  const contentW = pageW - marginL - marginR;
  let y = 56;

  function checkPage(need){
    if(y + need > 780){
      doc.addPage();
      y = 56;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9);
      doc.setTextColor(120,120,120);
      doc.text('MAPA DE FORÇA · 9ª CIPM (continuação)', marginL, 34);
      doc.setDrawColor(220); doc.line(marginL, 40, pageW - marginR, 40);
      doc.setTextColor(0,0,0);
    }
  }
  function line(text, opts={}){
    const size = opts.size || 10.5;
    const bold = opts.bold || false;
    const gap = opts.gap !== undefined ? opts.gap : size + 6;
    doc.setFont('helvetica', bold ? 'bold' : 'normal');
    doc.setFontSize(size);
    const wrapped = doc.splitTextToSize(text, contentW);
    checkPage(wrapped.length * gap + 4);
    doc.text(wrapped, marginL, y);
    y += wrapped.length * gap;
  }

  // Cabeçalho com faixa colorida
  doc.setFillColor(11,31,110);
  doc.rect(0, 0, pageW, 76, 'F');
  doc.setFillColor(200,16,46);
  doc.rect(0, 76, pageW, 3, 'F');
  const subtitleLine = activeBucketType === 'evento'
    ? `Relatório de Evento/ Operação — ${fmtDateBR(selectedEventDate)}`
    : `Relatório do dia ${fmtDateBR(selectedDate)}`;
  try{
    doc.addImage(LOGO_B64, 'PNG', marginL, 12, 40, 57);
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(18);
    doc.text('MAPA DE FORÇA', marginL + 54, 36);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10.5);
    doc.text('9ª Companhia Independente de Polícia Militar', marginL + 54, 52);
    doc.setFontSize(10);
    doc.text(subtitleLine, marginL + 54, 66);
  }catch(e){
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(18);
    doc.text('MAPA DE FORÇA', marginL, 40);
  }
  doc.setTextColor(0,0,0);
  y = 105;
  doc.setDrawColor(200); doc.line(marginL, y, pageW - marginR, y); y += 18;

  {
    const dc = dailyCommandCurrent || {};
    line('Serviço diário', {bold:true, size:12.5, gap:16});
    line(`Comando: ${dc.comando || '-'}`, {size:10, gap:13});
    line(`Subcomando: ${dc.subcomando || '-'}`, {size:10, gap:13});
    y += 6;
    doc.setDrawColor(230); doc.line(marginL, y, pageW - marginR, y); y += 18;
  }

  function fmtWhen(ts){
    if(!ts) return '-';
    const d = new Date(ts);
    return `${fmtDateBR(d.toISOString().slice(0,10))} às ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  }
  function pad2(n){ return String(n).padStart(2,'0'); }

  function printBlock(src, whenLabel, whenTs){
    checkPage(100);
    const headerParts = [];
    if(src.evento) headerParts.push(src.evento);
    headerParts.push(...[src.gt, src.cidade, src.codigo].filter(Boolean));
    const headerLine = headerParts.join(' - ') || 'Lançamento';
    line(headerLine, {bold:true, size:12.5, gap:16});
    line(`${whenLabel}: ${fmtWhen(whenTs)}`, {size:9.5, gap:12});
    line(`Data do serviço: ${fmtDateBR(src.date)}    Horário: ${src.inicio} às ${src.fim}`, {size:10.5, gap:14});
    line('Efetivo:', {bold:true, size:10.5, gap:14});
    src.efetivo.forEach(p => {
      line(`• ${p.patente || '(patente não informada)'} ${p.re} ${p.nome}${p.motorista ? ' (motorista)' : ''}${p.tel ? '  |  Tel: ' + p.tel : ''}`, {size:10.5, gap:13});
      if(p.viatura){
        line(`   Viatura individual: ${p.viatura.modelo || '-'}  KM: ${p.viatura.km || '-'}  PAT: ${p.viatura.pat || '-'}  Placa: ${p.viatura.placa || '-'}${p.viatura.armadoCartao ? '  |  Armado c/ cartão: ' + (p.viatura.armadoCartao === 'sim' ? 'Sim' : 'Não') : ''}`, {size:9.5, gap:12});
      }
      if(p.observacao){
        line(`   Obs.: ${p.observacao}`, {size:9.5, gap:12});
      }
      y += 6; // espaço entre policiais
    });
    const gv = src.viatura || {};
    if(gv.modelo || gv.km || gv.pat || gv.placa){
      line(`Viatura geral: ${gv.modelo || '-'}    KM: ${gv.km || '-'}    PAT: ${gv.pat || '-'}    Placa: ${gv.placa || '-'}`, {size:10.5, gap:14});
      if(gv.armadoCartao){
        line(`Armado com o cartão: ${gv.armadoCartao === 'sim' ? 'Sim' : 'Não'}`, {size:10.5, gap:14});
      }
    }
  }

  let lastEventoPDF = null;
  dayLaunches.forEach((l, idx) => {
    checkPage(100);
    if(activeBucketType === 'evento' && l.evento !== lastEventoPDF){
      checkPage(30);
      doc.setFillColor(11,31,110);
      doc.setTextColor(255,255,255);
      doc.rect(marginL, y - 12, contentW, 18, 'F');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10.5);
      doc.text(`EVENTO/OPERAÇÃO: ${l.evento || '(sem nome de evento)'}`, marginL + 6, y + 1);
      doc.setTextColor(0,0,0);
      y += 16;
      lastEventoPDF = l.evento;
    }
    if(l.edited && l.original){
      printBlock(l.original, 'Cadastro original lançado em', l.createdAt);
      y += 4;
      line('Observação: este registro foi alterado após o lançamento original. Edição registrada abaixo.', {size:9.5, gap:13});
      y += 6;
      printBlock(l, 'Editado em', l.editedAt);
    } else {
      printBlock(l, 'Cadastro lançado em', l.createdAt);
    }
    if(l.gcoi){
      y += 2;
      line(`CADASTRO DA GCOI: preenchido em ${fmtWhen(l.gcoiAt)}.`, {size:9.5, gap:13});
    }
    if(l.removed){
      y += 4;
      doc.setTextColor(200,16,46);
      line(`Observação: este registro foi removido em ${fmtWhen(l.removedAt)}. Motivo: ${l.removedReason || 'não informado'}. Mantido aqui para fins de controle.`, {bold:true, size:9.5, gap:13});
      doc.setTextColor(0,0,0);
    }
    y += 10;
    doc.setDrawColor(230); doc.line(marginL, y, pageW - marginR, y);
    y += 16;
  });

  // Quantitativo de lançamentos (por posto/graduação)
  checkPage(60);
  const visibleForQuant = dayLaunches.filter(l => !l.removed);

  function printQuantBlock(title, q){
    checkPage(60);
    line(title, {bold:true, size:12.5, gap:16});
    q.entries.forEach(([pat, n, nAtivo]) => {
      line(`${pat}: ${n} (${nAtivo} ativos)`, {size:10, gap:13});
    });
    y += 4;
    line(`Oficiais: ${q.oficiais} (${q.oficiaisAtivos} ativos)`, {bold:true, size:10.5, gap:14});
    line(`Praças: ${q.pracas} (${q.pracasAtivos} ativos)`, {bold:true, size:10.5, gap:14});
    if(q.outros > 0){
      line(`Outros (posto não padronizado): ${q.outros} (${q.outrosAtivos} ativos)`, {size:10, gap:13});
    }
    y += 2;
    line(`Total: ${q.total} (${q.totalAtivos} ativos)`, {bold:true, size:12, gap:16});
    y += 6;
  }

  function printVeiculosBlock(title, v){
    checkPage(40);
    line(title, {bold:true, size:11, gap:14});
    line(`4 rodas (geral): ${v.carros} (${v.carrosAtivos} ativos)`, {size:10, gap:13});
    line(`2 rodas (motos): ${v.motos} (${v.motosAtivos} ativos)`, {size:10, gap:13});
    line(`Total de viaturas: ${v.total} (${v.totalAtivos} ativos)`, {bold:true, size:10.5, gap:14});
    y += 6;
  }

  function printEquipesPostosBlock(title, e){
    checkPage(40);
    line(title, {bold:true, size:11, gap:14});
    line(`Equipes de serviço: ${e.equipes} (${e.equipesAtivas} ativas)`, {size:10, gap:13});
    line(`Postos de serviço: ${e.postos} (${e.postosAtivos} ativos)`, {size:10, gap:13});
    line(`Total: ${e.total} (${e.totalAtivos} ativos)`, {bold:true, size:10.5, gap:14});
    y += 6;
  }

  if(activeBucketType === 'evento'){
    const groups = {};
    visibleForQuant.forEach(l => {
      const key = l.evento || '(sem nome de evento)';
      if(!groups[key]) groups[key] = [];
      groups[key].push(l);
    });
    const groupNames = Object.keys(groups).sort((a, b) => a.localeCompare(b));
    line('QUANTITATIVO DE LANÇAMENTOS', {bold:true, size:12.5, gap:16});
    groupNames.forEach(name => {
      printQuantBlock(`Evento/ Operação: ${name}`, computeQuantitativo(groups[name]));
      printVeiculosBlock(`Viaturas — ${name}`, computeVeiculos(groups[name]));
      printEquipesPostosBlock(`Equipes/ Postos — ${name}`, computeEquipesPostos(groups[name]));
    });
    if(groupNames.length > 1){
      printQuantBlock('Total geral (todos os eventos)', computeQuantitativo(visibleForQuant));
      printVeiculosBlock('Viaturas — Total geral (todos os eventos)', computeVeiculos(visibleForQuant));
      printEquipesPostosBlock('Equipes/ Postos — Total geral (todos os eventos)', computeEquipesPostos(visibleForQuant));
    }
  } else {
    printQuantBlock('QUANTITATIVO DE LANÇAMENTOS', computeQuantitativo(visibleForQuant));
    printVeiculosBlock('Viaturas utilizadas', computeVeiculos(visibleForQuant));
    printEquipesPostosBlock('Equipes e Postos de serviço', computeEquipesPostos(visibleForQuant));
  }

  checkPage(30);
  line(MOTTO, {bold:true, size:10.5, gap:14});

  // Marca d'água diagonal em todas as páginas
  const pageH = doc.internal.pageSize.getHeight();
  const totalPages = doc.internal.getNumberOfPages();
  for(let p = 1; p <= totalPages; p++){
    doc.setPage(p);
    doc.saveGraphicsState();
    doc.setGState(new doc.GState({ opacity: 0.07 }));
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(80);
    doc.setTextColor(11,31,110);
    doc.text('9ª CIPM', pageW / 2, pageH / 2, { angle: 45, align: 'center' });
    doc.restoreGraphicsState();
  }

  const fileSuffix = activeBucketType === 'evento'
    ? `evento_${selectedEventDate}`
    : selectedDate;
  doc.save(`mapa-de-forca_${fileSuffix}.pdf`);
}

function updateRowEdit(id, field, value){
  const r = efetivoRowsEdit.find(x => x.id === id);
  if(r) r[field] = value;
}
function onNomeChangeEdit(id, value){
  const r = efetivoRowsEdit.find(x => x.id === id);
  if(!r) return;
  r.nome = value;
  const match = findOfficerByName(value);
  if(match){
    if(!r.patente) r.patente = match.patente || '';
    if(!r.re) r.re = match.re || '';
    if(!r.tel) r.tel = match.tel || '';
  }
  renderEfetivoRowsEdit();
}
function updateRowEditChecked(id, field, value){
  const r = efetivoRowsEdit.find(x => x.id === id);
  if(r) r[field] = value;
}
function toggleRowViaturaEdit(id){
  const r = efetivoRowsEdit.find(x => x.id === id);
  if(!r) return;
  r.viatura = r.viatura ? null : { modelo:"", km:"", pat:"", placa:"", armadoCartao:"" };
  renderEfetivoRowsEdit();
}
function updateRowViaturaEdit(id, field, value){
  const r = efetivoRowsEdit.find(x => x.id === id);
  if(r && r.viatura) r.viatura[field] = value;
}
function addEfetivoRowEdit(){
  efetivoRowsEdit.push({id:uid(), patente:"", re:"", nome:"", tel:"", sexo:"M", motorista:false, viatura:null, observacao:""});
  renderEfetivoRowsEdit();
}
function removeEfetivoRowEdit(id){
  efetivoRowsEdit = efetivoRowsEdit.filter(r => r.id !== id);
  renderEfetivoRowsEdit();
}

function closeEditModal(){
  document.getElementById('modalRoot').innerHTML = '';
  editingLaunchId = null;
}

async function saveEditLaunch(){
  const l = launches.find(x => x.id === editingLaunchId);
  if(!l) return;
  const oldDate = l.date;
  const oldEvento = l.evento;
  const wasEvento = activeBucketType === 'evento';

  const efetivo = efetivoRowsEdit.filter(r => r.nome.trim() !== "").map(r => ({...r}));
  if(efetivo.length === 0){
    alert("O efetivo não pode ficar vazio.");
    return;
  }

  // preserva o registro original apenas na primeira edição
  if(!l.original){
    l.original = {
      gt: l.gt, cidade: l.cidade, codigo: l.codigo, evento: l.evento,
      date: l.date, inicio: l.inicio, fim: l.fim,
      efetivo: l.efetivo, viatura: l.viatura
    };
  }

  setBtnSaving('btnSaveEdit', true);

  if(wasEvento){
    l.evento = document.getElementById('eEvento').value.trim() || l.evento;
  }
  l.gt = document.getElementById('eGt').value.trim();
  l.cidade = document.getElementById('eCidade').value.trim();
  l.codigo = document.getElementById('eCodigo').value.trim();
  l.date = document.getElementById('eData').value || l.date;
  l.inicio = document.getElementById('eInicio').value;
  l.fim = document.getElementById('eFim').value;
  l.viatura = {
    modelo: document.getElementById('evModelo').value.trim(),
    km: document.getElementById('evKm').value.trim(),
    pat: document.getElementById('evPat').value.trim(),
    placa: document.getElementById('evPlaca').value.trim(),
    armadoCartao: (document.querySelector('input[name="evArmado"]:checked') || {}).value || ''
  };
  l.efetivo = efetivo;
  l.edited = true;
  l.editedAt = Date.now();
  l.editadoPor = currentUserEmail;
  l.gcoi = false;
  l.gcoiAt = null;

  const moved = l.date !== oldDate;

  if(moved){
    // move o lançamento para a "gaveta" da nova data (mesmo bucket do tipo atual: diário ou evento)
    launches = launches.filter(x => x.id !== l.id);
    if(wasEvento){
      await saveKey(eventLaunchesKey(oldDate), launches);
      await loadEventoData(l.date);
      launches.push(l);
      await persistLaunches();
    } else {
      await saveKey(launchesKey(oldDate), launches);
      await loadDateData(l.date);
      launches.push(l);
      await persistLaunches();
    }
  } else {
    await persistLaunches();
  }

  if(wasEvento && l.evento !== oldEvento){
    await addEventToIndex(l.evento);
  }
  await updateOfficerIndex(l.efetivo);
  await updateVehicleIndex(l.viatura, ...l.efetivo.map(p => p.viatura));

  closeEditModal();
  renderActiveListView();
}

function canChangeLockHour(){ return isAdmin(); }
function canManageUsers(){ return isAdmin() || isReduzido(); }

function renderLoginScreen(msg){
  document.getElementById('app').innerHTML = `
    <div style="max-width:360px; margin:60px auto; padding:0 16px;">
      <div class="flex-between" style="justify-content:center; margin-bottom:20px;">

      </div>
      <div class="card">
        <label>E-mail</label>
        <input type="email" id="loginEmail" placeholder="seu@email.com" />
        <label>Senha</label>
        <input type="password" id="loginSenha" placeholder="••••••••" style="margin-bottom:0;" />
        ${msg ? `<div style="color:var(--danger); font-size:12.5px; margin-top:10px;">${msg}</div>` : ''}
        <button class="btn btn-accent btn-block" style="margin-top:14px;" onclick="attemptLogin()">Entrar</button>
      </div>

}

async function attemptLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  if(!email || !senha){
    renderLoginScreen('Preencha e-mail e senha.');
    return;
  }
  try{
    await auth.signInWithEmailAndPassword(email, senha);
  }catch(e){
    renderLoginScreen('E-mail ou senha incorretos.');
  }
}

function logout(){
  auth.signOut();
}

function openChangePasswordModal(){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) closeChangePasswordModal()">
      <div class="modal">
        <div class="modal-head">
          <span class="section-title" style="margin-bottom:0;">Trocar minha senha</span>
          <button class="close" onclick="closeChangePasswordModal()">✕</button>
        </div>
        <label>Senha atual</label>
        <input type="password" id="senhaAtual" />
        <label>Nova senha (mín. 6 caracteres)</label>
        <input type="password" id="senhaNova" />
        <label>Confirmar nova senha</label>
        <input type="password" id="senhaNovaConfirma" style="margin-bottom:0;" />
        <div id="senhaMsg" class="muted" style="margin-top:8px;"></div>
        <button class="btn btn-accent btn-block" id="btnTrocarSenha" style="margin-top:14px;" onclick="submitChangePassword()">Salvar nova senha</button>
      </div>
    </div>
  `;
}
function closeChangePasswordModal(){ document.getElementById('modalRoot').innerHTML = ''; }

async function submitChangePassword(){
  const atual = document.getElementById('senhaAtual').value;
  const nova = document.getElementById('senhaNova').value;
  const confirma = document.getElementById('senhaNovaConfirma').value;
  const msgEl = document.getElementById('senhaMsg');

  if(!atual || !nova || !confirma){
    msgEl.textContent = 'Preencha todos os campos.';
    return;
  }
  if(nova.length < 6){
    msgEl.textContent = 'A nova senha precisa ter pelo menos 6 caracteres.';
    return;
  }
  if(nova !== confirma){
    msgEl.textContent = 'As duas senhas novas não são iguais.';
    return;
  }

  const btn = document.getElementById('btnTrocarSenha');
  btn.disabled = true; btn.textContent = 'Salvando...';
  msgEl.textContent = '';

  try{
    const user = auth.currentUser;
    const cred = firebase.auth.EmailAuthProvider.credential(user.email, atual);
    await user.reauthenticateWithCredential(cred);
    await user.updatePassword(nova);
    closeChangePasswordModal();
    alert('Senha alterada com sucesso.');
  }catch(e){
    btn.disabled = false; btn.textContent = 'Salvar nova senha';
    if(e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential'){
      msgEl.textContent = 'Senha atual incorreta.';
    } else {
      msgEl.textContent = 'Erro: ' + e.message;
    }
  }
}

async function checkPermissionAndStart(user){
  currentUserEmail = user.email.toLowerCase();
  try{
    const snap = await db.collection(PERMISSIONS_COLLECTION).doc(currentUserEmail).get();
    if(!snap.exists){
      document.getElementById('app').innerHTML = `
        <div style="max-width:360px; margin:60px auto; padding:0 16px; text-align:center;">
          <p style="color:var(--text);">Seu e-mail (<b>${currentUserEmail}</b>) não tem acesso liberado neste app.</p>
          <p class="muted">Fale com o administrador para solicitar acesso.</p>
          <button class="btn btn-ghost btn-block" style="margin-top:16px;" onclick="logout()">Sair</button>
        </div>
      `;
      return;
    }
    currentUserLevel = snap.data().nivel || 'geral';
    document.getElementById('app').innerHTML = APP_SHELL_HTML;
    await loadAll();
  }catch(e){
    document.getElementById('app').innerHTML = `<div style="padding:20px; color:var(--danger);">Erro ao verificar permissões: ${e.message}</div>`;
  }
}

auth.onAuthStateChanged((user) => {
  if(user){
    checkPermissionAndStart(user);
  } else {
    currentUserEmail = null;
    currentUserLevel = null;
    renderLoginScreen();
  }
});
